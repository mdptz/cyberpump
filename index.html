<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CYBERPUMP - Workout Manager</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  
  <!-- PWA Manifest & iOS Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CYBERPUMP">
  <meta name="theme-color" content="#090c10">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW reg error:', err));
      });
    }
  </script>
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="logo-container">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">CYBER<span class="highlight">PUMP</span></span>
      </div>
      <div class="header-actions">
        <button id="quick-silent-toggle" class="icon-btn" title="Toggle Silent Mode">
          <span class="icon" id="silent-icon">🔊</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Content Body -->
    <main id="main-content" class="main-content">
      <!-- Views will be dynamically injected here -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="workouts">
        <span class="nav-icon">🏋️</span>
        <span class="nav-label">Workouts</span>
      </button>
      <button class="nav-item" data-view="active-workout">
        <span class="nav-icon">▶️</span>
        <span class="nav-label">Active</span>
        <span id="active-badge" class="nav-badge hidden">●</span>
      </button>
      <button class="nav-item" data-view="diary">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Diary</span>
      </button>
      <button class="nav-item" data-view="share">
        <span class="nav-icon">📤</span>
        <span class="nav-label">Data</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!-- Global Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div id="modal-container" class="modal-container">
        <button id="modal-close" class="modal-close-btn">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Cordova / Capacitor Native Bridge -->
  <script src="capacitor.js"></script>
  <!-- Audio Synth & Speech Script -->
  <script src="audio.js"></script>
  <!-- Local Storage & State Management -->
  <script src="storage.js"></script>
<!-- Data Sharing & Import/Export -->
  <script src="exportImport.js"></script>
  <!-- Smartwatch Media Bridge -->
  <script src="watchBridge.js"></script>
  <!-- Main Application Logic -->
  <script src="app.js"></script>
  <script src="iap.js"></script>
</body>
</html>
